<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Project</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        .navbar {
            background-color: #222;
            color: white;
            padding: 18px 30px;
        }

        .navbar h2 {
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
        }

        .form-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 18px;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="url"],
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            resize: vertical;
        }

        #id_tech_stack {
            list-style: none;
            padding: 0;
        }

        #id_tech_stack li {
            margin-bottom: 8px;
        }

        #id_tech_stack label {
            display: inline;
            font-weight: normal;
            margin: 0;
        }

        .errorlist {
            color: red;
            margin: 8px 0;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button {
            background: #222;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        .cancel-btn {
            background: #777;
            color: white;
            text-decoration: none;
            padding: 11px 18px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="navbar">
    <h2>Portfolio Dashboard</h2>
</div>

<div class="container">

    <div class="form-box">

        <h1>Create Project</h1>

        <form method="POST">

            {% csrf_token %}

            {{ form.non_field_errors }}

            <label for="{{ form.project_name.id_for_label }}">
                Project Name
            </label>

            {{ form.project_name }}
            {{ form.project_name.errors }}


            <label for="{{ form.description.id_for_label }}">
                Project Description
            </label>

            {{ form.description }}
            {{ form.description.errors }}


            <label>
                Tech Stack
            </label>

            {{ form.tech_stack }}
            {{ form.tech_stack.errors }}


            <label for="{{ form.link.id_for_label }}">
                Project Link
            </label>

            {{ form.link }}
            {{ form.link.errors }}


            <div class="buttons">

                <button type="submit">
                    Create Project
                </button>

                <a
                    href="{% url 'dashboard' %}"
                    class="cancel-btn"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
